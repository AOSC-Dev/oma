[package]
name = "oma-apt-pkg"
version = "0.2.1"
edition = "2024"
description = "Rust-native parser for dpkg status and APT list files (deb822 format)"
license = "MIT"
authors = ["eatradish <sakiiily@aosc.io>"]

[features]
default = ["apt-lists", "dpkg-status", "filename", "search", "apt-config"]
apt-config = ["dep:tree-sitter", "dep:tree-sitter-apt-config"]
apt-lists = [
    "filename",
    "apt-sources",
    "dep:rkyv",
    "dep:memmap2",
    "dep:spdlog-rs",
    "dep:glob-match",
    "dep:ar",
    "dep:tar",
    "dep:flate2",
    "dep:zstd",
    "dep:liblzma",
    "dep:rayon",
]
apt-sources = ["apt-config", "filename", "dep:oma-apt-sources-lists"]
dpkg-status = []
filename = ["dep:aho-corasick", "dep:url"]
search-indicium = [
    "apt-lists",
    "dpkg-status",
    "dep:ahash",
    "dep:debversion",
    "dep:glob-match",
    "dep:indicium",
]
search-strsim = [
    "apt-lists",
    "dpkg-status",
    "dep:ahash",
    "dep:debversion",
    "dep:glob-match",
    "dep:strsim",
    "dep:memchr",
]
search-text = [
    "apt-lists",
    "dpkg-status",
    "dep:ahash",
    "dep:debversion",
    "dep:glob-match",
    "dep:memchr",
]

search = ["search-indicium", "search-strsim", "search-text"]

# Experimental dependency resolver (long-term, may change).
resolver = [
    "apt-lists",
    "search-text",
    "apt-sources",
    "dep:debversion",
    "dep:resolvo",
    "dep:oma-fetch",
    "dep:reqwest-middleware",
    "dep:tokio",
    "dep:flume",
    "dep:once_cell",
    "dep:oma-utils",
    "dep:regex",
]

[dependencies]
deb822-fast = { workspace = true }
deb822-lossless = { workspace = true, features = ["deb822-fast"] }
debian-control = { workspace = true }
oma-apt-sources-lists = { workspace = true, optional = true }
serde = { workspace = true }
thiserror = { workspace = true }
rkyv = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
spdlog-rs = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
ar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
liblzma = { workspace = true, optional = true }
ahash = { workspace = true, optional = true }
indexmap = { workspace = true, features = ["serde"] }
indicium = { workspace = true, optional = true }
debversion = { workspace = true, optional = true }
glob-match = { workspace = true, optional = true }
memchr = { workspace = true, optional = true }
strsim = { workspace = true, optional = true }
tree-sitter = { workspace = true, optional = true }
tree-sitter-apt-config = { workspace = true, optional = true }
aho-corasick = { workspace = true, optional = true }
url = { workspace = true, optional = true }
resolvo = { version = "0.12", optional = true }
oma-fetch = { workspace = true, default-features = false, optional = true }
reqwest-middleware = { workspace = true, optional = true }
tokio = { workspace = true, default-features = false, features = [
    "rt-multi-thread",
    "time",
    "net",
], optional = true }
flume = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
oma-utils = { workspace = true, optional = true }
regex = { workspace = true, optional = true }

[[bin]]
name = "oma-edsp"
required-features = ["resolver"]

[dev-dependencies]
tempfile = "3"
