[package]
name = "tree-sitter-apt-config"
description = "AptConfig grammar for tree-sitter"
version = "0.1.0"
authors = ["eatradish"]
license = "MIT"
keywords = ["incremental", "parsing", "tree-sitter", "apt-config"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/aosc-dev/oma"
edition = "2024"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = { workspace = true }

[build-dependencies]
cc = { workspace = true }

[dev-dependencies]
tree-sitter = { workspace = true }
